<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · MaterialTV</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141218">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;600;700&display=swap">
<style>
  :root { color-scheme: dark; --bg:#141218; --surface:#211F26; --surface-3:#2B2930; --primary:#D0BCFF; --on-primary:#381E72; --on-surface:#E6E0E9; --on-surface-variant:#CAC4D0; --outline:#938F99; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; font-family:"Google Sans Flex", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--on-surface); background:var(--bg); }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background: radial-gradient(60vmax 45vmax at 80% -10%, rgba(208,188,255,.16), transparent 60%), radial-gradient(50vmax 40vmax at -10% 90%, rgba(79,55,139,.22), transparent 65%); }
  main { max-width:520px; width:100%; text-align:center; background:var(--surface); border:1px solid rgba(73,69,79,.45); border-radius:28px; padding:40px 28px; }
  .code { font-size:clamp(72px, 20vw, 120px); font-weight:700; line-height:1; letter-spacing:-0.04em; color:var(--primary); margin:0; }
  h1 { font-size:26px; margin:12px 0 8px; font-weight:600; }
  p { color:var(--on-surface-variant); margin:0 0 28px; line-height:1.6; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  a.btn { display:inline-flex; align-items:center; min-height:48px; padding:12px 26px; border-radius:999px; font-weight:600; text-decoration:none; }
  .filled { background:var(--primary); color:var(--on-primary); }
  .outline { border:1px solid var(--outline); color:var(--primary); }
  a:focus-visible { outline:3px solid var(--primary); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>Page not found</h1>
  <p>This page doesn't exist. The MaterialTV install page is one click away.</p>
  <div class="actions">
    <a class="btn filled" href="/MaterialTV/">Go to MaterialTV</a>
    <a class="btn outline" href="https://github.com/Brick-Bread/MaterialTV">View on GitHub</a>
  </div>
</main>
</body>
</html>
